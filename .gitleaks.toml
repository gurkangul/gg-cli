# .gitleaks.toml — gitleaks configuration for gg-cli
# See: https://github.com/gitleaks/gitleaks?tab=readme-ov-file#configuration
#
# Policy: gitleaks built-in ruleset is active by default.
# Allowlist entries are documented in docs/security.md.
title = "gg-cli gitleaks config"

# Use the gitleaks built-in ruleset.
[extend]
useDefault = true

# Global allowlist — applies to every rule.
[allowlist]
description = "Project-wide false-positive suppression"
paths = [
  # Go test files contain synthetic secrets to exercise the scrub package.
  # None of these are real credentials.
  '''_test\.go''',
  # testdata directories contain fixtures, not real secrets.
  '''testdata''',
  # gitleaks configuration file contains example patterns by design.
  '''\.gitleaks\.toml''',
  # Security policy documents example keys in allowlist tables.
  '''docs/security\.md''',
  # gg runtime directory — installed.json, telemetry, and cache files are
  # not code and may contain incidental matches from scan reports.
  '''\.gg/''',
  # Temp gitleaks JSON report files (written by runGitleaksScan).
  # In --no-git mode gitleaks scans the working tree including /tmp, so
  # exclude the report pattern defensively in case /tmp is inside the tree.
  '''gitleaks-report-.*\.json''',
]
regexes = [
  # Canonical AWS documentation placeholder — not a real key.
  '''AKIAIOSFODNN7EXAMPLE''',
  # Synthetic key prefix used in unit tests to verify scanner detection.
  '''sk-test[A-Za-z0-9]{10,}''',
  # Historical synthetic GitHub PAT fixture accidentally committed and removed
  # in TASK-348; exact literal only, never broaden this to real PAT shapes.
  '''ghp_R4nd0mF4k3T0k3nF0rD3m0Purp0s3sOnly12''',
]
