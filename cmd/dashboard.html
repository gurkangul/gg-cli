<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gg — project brain</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3340;
    --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
    --yellow:#d29922; --purple:#bc8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .brand{color:var(--accent);font-weight:700}
  header .proj{color:var(--dim);font-size:12px}
  header .live{margin-left:auto;font-size:11px;color:var(--green);border:1px solid var(--border);padding:3px 9px;border-radius:20px}
  nav{display:flex;gap:4px;padding:10px 22px;border-bottom:1px solid var(--border);background:var(--panel)}
  nav button{background:transparent;color:var(--dim);border:0;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px}
  nav button:hover{color:var(--fg);background:var(--panel2)}
  nav button.active{color:var(--fg);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--accent)}
  main{padding:22px;max-width:1100px;margin:0 auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px}
  .card .n{font-size:28px;font-weight:700}
  .card .l{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .sub{color:var(--dim);font-size:11px;margin-top:3px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:26px 0 12px;font-weight:600}
  .row{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px}
  .row .meta{color:var(--dim);font-size:11px;margin-bottom:4px;display:flex;gap:10px;flex-wrap:wrap}
  .row .txt{font-size:13.5px}
  .row .why{color:var(--dim);font-size:12.5px;margin-top:4px}
  .pill{font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--border)}
  .pin{color:var(--yellow)}
  .tag{color:var(--purple)}
  .sev-high,.sev-critical{color:var(--red)} .sev-medium{color:var(--yellow)} .sev-low{color:var(--dim)}
  .st-done,.st-fixed{color:var(--green)} .st-open,.st-reopened{color:var(--red)} .st-in_progress,.st-fixing,.st-ready_for_live{color:var(--accent)}
  .search-box{display:flex;gap:10px;margin-bottom:8px}
  .search-box input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:9px;color:var(--fg);padding:12px 14px;font-size:14px}
  .search-box input:focus{outline:0;border-color:var(--accent)}
  .search-box button{background:var(--accent);color:#04121f;border:0;border-radius:9px;padding:0 20px;font-weight:600;cursor:pointer}
  .pipeline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0;color:var(--dim);font-size:12px}
  .pipeline .step{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
  .pipeline .step b{color:var(--fg)} .pipeline .arrow{color:var(--accent)}
  .score{height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px}
  .score>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--green))}
  .empty{color:var(--dim);padding:30px;text-align:center}
  pre{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px;overflow:auto;font-size:12px;color:var(--dim)}
  .hint{color:var(--dim);font-size:12px;margin-bottom:14px}
  .canon h3{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
  .canon .line{font-size:13px;padding:3px 0;border-bottom:1px solid var(--panel2)}
</style>
</head>
<body>
<header>
  <h1><span class="brand">gg</span> · project brain</h1>
  <span class="proj" id="proj">…</span>
  <span class="live">● localhost · read-only</span>
</header>
<nav>
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="search">Live Search</button>
  <button data-tab="decisions">Decisions</button>
  <button data-tab="tasks">Work</button>
  <button data-tab="bugs">Bugs</button>
  <button data-tab="telemetry">Telemetry</button>
</nav>
<main id="view"><div class="empty">loading…</div></main>

<script>
const $ = (h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const esc = (s)=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const view = document.getElementById('view');
const j = async (u)=>{try{return await (await fetch(u)).json()}catch(e){return {error:String(e)}}};
const date = (s)=> s? String(s).slice(0,10) : '';

function tags(t){ return (t||[]).map(x=>`<span class="pill tag">#${esc(x)}</span>`).join(' '); }

function decisionRow(d){
  return `<div class="row">
    <div class="meta"><span>${date(d.CreatedAt)}</span>${d.Pinned?'<span class="pill pin">📌 pinned</span>':''}${tags(d.Tags)}${d.ID?'<span>'+esc(d.ID)+'</span>':''}</div>
    <div class="txt">${esc(d.Text)}</div>
    ${d.Reason?`<div class="why">— ${esc(d.Reason)}</div>`:''}
    ${d.Evidence?`<div class="why">✓ ${esc(d.Evidence)}</div>`:(d.Text&&d.Reason?'<div class="why" style="color:var(--yellow)">[unverified]</div>':'')}
  </div>`;
}
function scored(d, max){
  const sc = d.semantic_score||0; const pct = max>0?Math.round(sc/max*100):0;
  return `<div class="row">
    <div class="meta"><span>${date(d.CreatedAt)}</span><span style="color:var(--accent)">score ${sc.toFixed(3)}</span>${tags(d.Tags)}</div>
    <div class="txt">${esc(d.Text||d.Approach||d.Title)}</div>
    ${d.Reason?`<div class="why">— ${esc(d.Reason)}</div>`:''}
    <div class="score"><i style="width:${pct}%"></i></div>
  </div>`;
}

const tabs = {
  async overview(){
    const o = await j('/api/overview'); if(o.error) return `<div class="empty">${esc(o.error)}</div>`;
    const c=o.counts||{};
    const card=(n,l,sub)=>`<div class="card"><div class="n">${n??0}</div><div class="l">${l}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
    let canon='';
    (o.canon||[]).forEach(e=>{
      canon+=`<h3>${esc(e.area)}</h3>`+e.text.split('\n').map(l=>`<div class="line">${esc(l)}</div>`).join('');
    });
    return `<div class="cards">
      ${card(c.decisions,'decisions','memory, never deleted')}
      ${card(c.tasksDone+'/'+c.tasks,'work done','tasks completed')}
      ${card(c.bugsFixed,'bugs fixed', c.bugsOpen+' open')}
      ${card(c.rejections,'rejections','what not to do')}
    </div>
    <h2>Canon — distilled institutional memory (auto-derived)</h2>
    <div class="canon">${canon||'<div class="empty">no canon yet</div>'}</div>
    <h2>Recent decisions</h2>
    ${(o.recentDecisions||[]).slice(0,15).map(decisionRow).join('')||'<div class="empty">none</div>'}`;
  },
  async search(){
    return `<div class="hint">Type a question. See exactly how gg answers it: your text is embedded into a 768-dim vector (Ollama), then Qdrant returns the nearest records by cosine similarity — the same path an agent's <code>gg search</code> takes.</div>
    <div class="search-box">
      <input id="q" placeholder="e.g. why is JSONL the source of truth?" autofocus>
      <button onclick="runSearch()">Search</button>
    </div>
    <div id="sresult"></div>`;
  },
  async decisions(){
    const d = await j('/api/decisions');
    return `<h2>${(d||[]).length} active decisions (noise-filtered)</h2>`+((d||[]).map(decisionRow).join('')||'<div class="empty">none</div>');
  },
  async tasks(){
    const t = await j('/api/tasks');
    return `<h2>${(t||[]).length} tasks</h2>`+((t||[]).map(x=>`<div class="row"><div class="meta"><span>${esc(x.ID)}</span><span class="st-${esc(x.Status)}">${esc(x.Status)}</span>${x.Priority?'<span class="pill">'+esc(x.Priority)+'</span>':''}${x.Owner?'<span>@'+esc(x.Owner)+'</span>':''}</div><div class="txt">${esc(x.Title)}</div></div>`).join('')||'<div class="empty">none</div>');
  },
  async bugs(){
    const b = await j('/api/bugs');
    return `<h2>${(b||[]).length} bugs</h2>`+((b||[]).map(x=>`<div class="row"><div class="meta"><span>${esc(x.ID)}</span><span class="st-${esc(x.Status)}">${esc(x.Status)}</span><span class="sev-${esc(x.Severity)}">${esc(x.Severity)}</span></div><div class="txt">${esc(x.Title)}</div>${x.RootCause?`<div class="why">root cause: ${esc(x.RootCause)}</div>`:''}</div>`).join('')||'<div class="empty">none</div>');
  },
  async telemetry(){
    const t = await j('/api/telemetry');
    return `<h2>Telemetry (last 7d)</h2><div class="hint">Context economy + agent activity recorded locally.</div><pre>${esc(JSON.stringify(t,null,2))}</pre>`;
  },
};

async function runSearch(){
  const q = document.getElementById('q').value.trim(); if(!q) return;
  const box = document.getElementById('sresult'); box.innerHTML='<div class="empty">searching…</div>';
  const r = await j('/api/search?q='+encodeURIComponent(q));
  if(r.error){ box.innerHTML=`<div class="empty">${esc(r.error)}</div>`; return; }
  const all=[...(r.decisions||[]),...(r.rejections||[]),...(r.bugs||[])];
  const max=Math.max(0.0001,...all.map(d=>d.semantic_score||0));
  box.innerHTML = `<div class="pipeline">
    <div class="step">“${esc(r.query)}”</div><span class="arrow">→</span>
    <div class="step">embed → <b>${r.vectorDim}-dim</b> vector <b>${r.embedMs}ms</b></div><span class="arrow">→</span>
    <div class="step">Qdrant cosine search <b>${r.searchMs}ms</b></div><span class="arrow">→</span>
    <div class="step"><b>${all.length}</b> hits</div>
  </div>
  ${r.decisions&&r.decisions.length?'<h2>Decisions</h2>'+r.decisions.map(d=>scored(d,max)).join(''):''}
  ${r.rejections&&r.rejections.length?'<h2>Rejected approaches</h2>'+r.rejections.map(d=>scored(d,max)).join(''):''}
  ${r.bugs&&r.bugs.length?'<h2>Bugs</h2>'+r.bugs.map(d=>scored(d,max)).join(''):''}
  ${all.length===0?'<div class="empty">no matches</div>':''}`;
}

let current='overview';
async function render(tab){
  current=tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  view.innerHTML='<div class="empty">loading…</div>';
  view.innerHTML = await tabs[tab]();
  if(tab==='search'){ const i=document.getElementById('q'); if(i){ i.focus(); i.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()}); } }
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(b.dataset.tab));
j('/api/overview').then(o=>{document.getElementById('proj').textContent=o.project||''});
render('overview');
</script>
</body>
</html>
