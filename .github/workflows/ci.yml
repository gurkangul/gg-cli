name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Windows'
        # Canonical test command (see docs/testing.md). CI never uses -short.
        run: go test ./... -race -count=1 -timeout=120s

      - name: Test (Windows)
        if: runner.os == 'Windows'
        # Windows runners do not consistently provide the C toolchain needed by
        # the Go race detector; keep the same package set and timeout.
        run: go test ./... -count=1 -timeout=120s

      - name: Coverage thresholds
        if: runner.os != 'Windows'
        shell: bash
        run: |
          check_coverage() {
            pkg="$1"; threshold="$2"
            pct=$(go test "$pkg" -coverprofile=/tmp/cov.out -covermode=atomic -count=1 2>/dev/null | grep -oE '[0-9]+\.[0-9]+%' | tr -d '%')
            if [ -z "$pct" ]; then
              echo "FAIL: could not measure coverage for $pkg"
              exit 1
            fi
            # Compare using awk for float arithmetic
            ok=$(echo "$pct $threshold" | awk '{print ($1 >= $2) ? "yes" : "no"}')
            if [ "$ok" = "yes" ]; then
              echo "OK: $pkg ${pct}% >= ${threshold}%"
            else
              echo "FAIL: $pkg ${pct}% < ${threshold}% (required)"
              exit 1
            fi
          }
          check_coverage ./cmd 30
          check_coverage ./internal/store 40
          check_coverage ./internal/graph 20

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        with:
          version: latest
          args: --timeout=5m

  vulncheck:
    name: vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./...

  docs-drift:
    name: docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate CLI docs
        run: go run ./tools/docs-gen

      - name: Check for drift
        run: |
          if ! git diff --exit-code docs/cli/; then
            echo ""
            echo "docs/cli/ is out of date — run 'go run ./tools/docs-gen' locally and commit the result."
            exit 1
          fi
