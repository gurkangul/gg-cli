# Unique project identifier — namespaces this project's collections (vectors are
# stored per-project). Auto-generated by `gg init`. Do not change after
# tasks/decisions are written.
project_id: PROJECT_ID_PLACEHOLDER

# Vector store. Default: embedded SQLite (no Docker) — vectors live in
# .gg/vectorstore.db. Set backend: qdrant to use a Qdrant server at host:port
# instead (add a qdrant service to ~/.gg/docker-compose.yaml — no longer shipped
# by default — then `docker compose -f ~/.gg/docker-compose.yaml up -d qdrant`).
# The GG_VECTOR_BACKEND env var overrides this field.
qdrant:
  backend: sqlite       # sqlite (default, embedded, no Docker) | qdrant (server)
  host: localhost       # Qdrant gRPC host — only used when backend: qdrant
  port: 6334            # Qdrant gRPC port (NOT the HTTP 6333 port)

embedding:
  backend: ollama                # ollama (default, offline) | voyage (cloud, opt-in)
  host: http://localhost:11434   # Ollama base URL (ollama backend only).
                                 # Install native Ollama: `brew install ollama` then
                                 # `ollama serve` + `ollama pull nomic-embed-text`.
  model: nomic-embed-text        # 768-dim — matches the vector store size

  # Optional Voyage AI cloud backend. OFF by default: it sends your text
  # off-machine (privacy trade-off) in exchange for higher-quality embeddings.
  # To enable: set backend: voyage above, export VOYAGE_API_KEY in your shell
  # (never store the key here), then run `gg reembed` — voyage's dimension
  # differs from nomic's 768 so existing collections must be rebuilt.
  #
  # voyage:
  #   model: voyage-3.5-lite     # Voyage embedding model
  #   output_dim: 1024           # 256 | 512 | 1024 | 2048
  #   api_key_env: VOYAGE_API_KEY  # env var holding the key (key itself never stored)

# Graph store. Default: embedded SQLite (no Docker) — the code graph lives in
# .gg/graph.db. Set backend: memgraph to use a Memgraph server over Bolt instead
# (add a memgraph service to ~/.gg/docker-compose.yaml — no longer shipped by
# default — then `docker compose -f ~/.gg/docker-compose.yaml up -d memgraph`).
# The GG_GRAPH_BACKEND env var overrides this field.
memgraph:
  backend: sqlite                # sqlite (default, embedded, no Docker) | memgraph (server)
  uri: bolt://localhost:7687     # Bolt endpoint — only used when backend: memgraph
  username: ""                   # Leave empty — Memgraph default has no auth
  password: ""                   # Leave empty; set MEMGRAPH_PASSWORD env var instead of writing here
                                 # MEMGRAPH_URI and MEMGRAPH_USERNAME env vars also override their fields

backup:
  enabled: true                  # session-start auto backup toggle
  interval: 24h                  # staleness threshold for `gg brain export --if-stale`
  timeout: 30s                   # per-backup subprocess timeout

# bugs.require_broken_ref: set to true to make --repro-broken-ref mandatory on
# every `gg bug fix` call. When true, every fix must prove the repro failed at
# the pre-fix commit and passes at HEAD. Default false for back-compat.
#
# bugs:
#   require_broken_ref: true

# tasks.require_ready_for_live: opt-in gate that refuses `gg task done` unless
# the task first transitions to ready_for_live via `gg task ready-for-live`.
# Pair with verifier_separation to enforce that a different role from the one
# that set ready_for_live must close the task (blocks single-actor premature
# closure — the TASK-200→207 class of failure). Default false for back-compat.
#
# tasks:
#   require_ready_for_live: true
#   verifier_separation: true

# audit.thresholds: tune when `gg audit health` emits warnings. All values
# have built-in defaults shown below; override only what you need to change.
# reopen_rate_warn:      fraction >20% → "stabilize before adding" warning
# reopen_rate_freeze:    fraction >40% → "freeze new features" recommendation
# surface_pressure_p95:  p95 distinct files/fix >3 → "centralize common state" warning
#
# audit:
#   thresholds:
#     reopen_rate_warn: 0.20
#     reopen_rate_freeze: 0.40
#     surface_pressure_p95: 3

# tracker.canonical: declare gg as the sole task tracker for this project.
# When set to "gg", the Claude Code PreToolUse guard blocks
# mcp__gsd-workflow__gsd_plan_* calls and redirects agents to gg task create.
# Leave commented out (or set to "") to allow gg + GSD to run side-by-side.
#
# tracker:
#   canonical: gg
